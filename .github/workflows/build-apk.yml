name: Build APK

# APK TIDAK dibangun di VM (RAM VM tidak cukup) — build jalan di runner
# GitHub Actions (ubuntu-latest, RAM 7 GB) setiap push ke main atau manual.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gradlew kehilangan bit executable saat di-push lewat GitHub API
      # (Contents API selalu menulis mode 100644), jadi set +x di sini.
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.50.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tren-riset-apk
          path: build/app/outputs/flutter-apk/app-release.apk
